<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:400px;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
    border:2px solid #2196f3;
    border-radius:6px;
    outline:none;
}

button{
    padding:10px 18px;
    background:#2196f3;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0d8bf2;
}

ul{
    list-style:none;
    margin-top:20px;
}

li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f1f1f1;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
}

.delete{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
}

.delete:hover{
    background:darkred;
}
</style>
</head>

<body>

<div class="container">

    <h2>To-Do List</h2>

    <div class="input-box">
        <input type="text" id="task" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="list"></ul>

</div>

<script>

function addTask(){

    let task=document.getElementById("task");
    let list=document.getElementById("list");

    if(task.value.trim()==""){
        alert("Please enter a task");
        return;
    }

    let li=document.createElement("li");

    li.innerHTML=`
        ${task.value}
        <button class="delete" onclick="this.parentElement.remove()">Delete</button>
    `;

    list.appendChild(li);

    task.value="";
}

</script>

</body>
</html>
