<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 90%;
        max-width: 450px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h1 {
        color: #333;
        margin-bottom: 25px;
    }

    .score-board {
        display: flex;
        justify-content: space-between;
        margin-bottom: 30px;
    }

    .score {
        width: 45%;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 10px;
    }

    .score h2 {
        font-size: 20px;
        margin-bottom: 10px;
    }

    .score p {
        font-size: 30px;
        font-weight: bold;
        color: #2a5298;
    }

    .choices {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .choice {
        width: 80px;
        height: 80px;
        border: none;
        border-radius: 50%;
        font-size: 35px;
        cursor: pointer;
        background: #2a5298;
        color: white;
        transition: 0.3s;
    }

    .choice:hover {
        transform: scale(1.1);
        background: #1e3c72;
    }

    .result {
        background: #f4f4f4;
        padding: 15px;
        border-radius: 10px;
    }

    .result p {
        font-size: 18px;
        font-weight: bold;
        color: #333;
    }
</style>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">
            <h1>Rock Paper Scissors</h1>

            <div class="score-board">
                <div class="score">
                    <h2>Player</h2>
                    <p id="player-score">0</p>
                </div>

                <div class="score">
                    <h2>Computer</h2>
                    <p id="computer-score">0</p>
                </div>
            </div>

            <div class="choices">
                <button class="choice" id="rock">✊</button>
                <button class="choice" id="paper">✋</button>
                <button class="choice" id="scissor">✌️</button>
            </div>

            <div class="result">
                <p id="result-text">Choose your move!</p>
            </div>
        </div>

    </body>

    </html>

    <script src="script.js"></script>
</body>

</html>
